<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Football Edge QoS Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  body {
    background: #0f1720;
    color: #e5e7eb;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
  }
  h1 { font-size: 20px; margin-bottom: 20px; }
  .layout {
    display: flex;
    gap: 20px;
  }
  .panel {
    background: #1a2532;
    border-radius: 8px;
    padding: 15px;
  }
  #pitch-container {
    width: 500px;
    height: 320px;
    position: relative;
  }
  #pitch {
    width: 100%;
    height: 100%;
    background: #1f8a4c;
    border: 2px solid white;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  .player-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #3b82f6;
    position: absolute;
    transition: left 0.5s linear, top 0.5s linear, background 0.2s;
  }
  .player-dot.impact {
    background: #ef4444;
    width: 16px;
    height: 16px;
  }
  #analytics-container {
    flex: 1;
  }
  #status {
    margin-bottom: 10px;
    font-size: 14px;
    color: #9ca3af;
  }
  #overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #overlay-box {
    background: #1a2532;
    border: 2px solid #ef4444;
    padding: 30px;
    border-radius: 8px;
    text-align: center;
  }
  #overlay-box h2 { color: #ef4444; margin-top: 0; }
  #resume-btn {
    margin-top: 15px;
    padding: 10px 25px;
    background: #ef4444;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>Football Edge QoS Dashboard</h1>
<div id="status">Connecting...</div>

<div class="layout">
  <div class="panel" id="pitch-container">
    <div id="pitch"></div>
  </div>
  <div class="panel" id="analytics-container">
    <canvas id="latencyChart" height="150"></canvas>
    <div id="stats" style="margin-top:15px; font-size:14px;"></div>
  </div>
</div>

<div id="overlay">
  <div id="overlay-box">
    <h2 id="overlay-title">INJURY DETECTED</h2>
    <p id="overlay-detail"></p>
    <button id="resume-btn">Resume Match</button>
  </div>
</div>

<script>
const pitch = document.getElementById("pitch");
const statusEl = document.getElementById("status");
const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlay-title");
const overlayDetail = document.getElementById("overlay-detail");
const resumeBtn = document.getElementById("resume-btn");

// Create 22 player dots at random starting positions
const playerDots = {};
for (let i = 1; i <= 22; i++) {
  const dot = document.createElement("div");
  dot.className = "player-dot";
  dot.style.left = Math.random() * 90 + "%";
  dot.style.top = Math.random() * 85 + "%";
  pitch.appendChild(dot);
  playerDots[i] = dot;
}

// Move players randomly every second (visual liveliness)
setInterval(() => {
  for (let i = 1; i <= 22; i++) {
    playerDots[i].style.left = Math.random() * 90 + "%";
    playerDots[i].style.top = Math.random() * 85 + "%";
  }
}, 1500);

// ---- Chart setup ----
const ctx = document.getElementById("latencyChart").getContext("2d");
const chart = new Chart(ctx, {
  type: "line",
  data: {
    labels: [],
    datasets: [
      { label: "Tier 1 (Urgent) Latency ms", data: [], borderColor: "#ef4444", tension: 0.2 },
      { label: "Tier 2 (Routine) Latency ms", data: [], borderColor: "#3b82f6", tension: 0.2 }
    ]
  },
  options: {
    animation: false,
    scales: {
      x: { ticks: { color: "#9ca3af" } },
      y: { ticks: { color: "#9ca3af" } }
    },
    plugins: { legend: { labels: { color: "#e5e7eb" } } }
  }
});

let tickCount = 0;
let tier1Count = 0, tier2Count = 0;

function updateStats() {
  document.getElementById("stats").innerText =
    `Tier 1 (Urgent) readings: ${tier1Count} | Tier 2 (Routine) readings: ${tier2Count}`;
}

// ---- WebSocket connection ----
const ws = new WebSocket(`ws://${window.location.host}/ws`);

ws.onopen = () => { statusEl.innerText = "Connected. Match starting..."; };

ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);

  if (msg.type === "PAUSE_EVENT") {
    const r = msg.reading;
    overlayTitle.innerText = r.major_event ? "MAJOR INJURY DETECTED" : "MINOR IMPACT DETECTED";
    overlayDetail.innerText = `Player ${r.player_id} at ${r.sim_time_min} min — accel: ${r.accel_value}`;
    overlay.style.display = "flex";
    // Flash that player's dot red
    if (playerDots[r.player_id]) {
      playerDots[r.player_id].classList.add("impact");
    }
    return;
  }

  if (msg.type === "MATCH_ENDED") {
    statusEl.innerText = "Match ended.";
    return;
  }

  // Normal reading
  const r = msg;
  tickCount++;
  if (r.tier === 1) { tier1Count++; } else { tier2Count++; }
  updateStats();

  chart.data.labels.push(tickCount);
  chart.data.datasets[0].data.push(r.tier === 1 ? r.edge_latency_ms : null);
  chart.data.datasets[1].data.push(r.tier === 2 ? r.edge_latency_ms : null);

  // Keep chart from growing forever — show last 100 points
  if (chart.data.labels.length > 100) {
    chart.data.labels.shift();
    chart.data.datasets[0].data.shift();
    chart.data.datasets[1].data.shift();
  }
  chart.update();
};

resumeBtn.onclick = async () => {
  overlay.style.display = "none";
  await fetch("/resume", { method: "POST" });
};
</script>

</body>
</html>
